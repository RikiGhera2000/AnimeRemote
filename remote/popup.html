<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime Remote</title>
  <style>
    body{font:14px Arial,sans-serif;width:300px;margin:0;padding:16px;background:#0d1420;color:#f4f7fb;box-sizing:border-box}
    h1{font-size:18px;margin:0 0 12px} .status{padding:10px;border-radius:9px;background:#182536;margin-bottom:12px}
    .title{font-weight:700;overflow-wrap:anywhere;margin-bottom:5px}.url{font-size:12px;color:#a8b4c4;overflow-wrap:anywhere}
    button{width:100%;border:0;border-radius:9px;padding:11px;margin-top:8px;font-weight:700;color:white;background:#2365e8;cursor:pointer}
    button.secondary{background:#344255}.hint{color:#a8b4c4;font-size:12px;line-height:1.4;margin:12px 0 0}
  </style>
</head>
<body>
  <h1>🎬 Anime Remote</h1>
  <div class="status" id="status">Controllo scheda…</div>
  <button id="link">Collega questa scheda</button>
  <button id="unlink" class="secondary">Scollega</button>
  <p class="hint">Apri prima la pagina dell’anime, poi premi “Collega questa scheda”. I comandi del telecomando andranno solo a questa scheda.</p>
  <script src="popup.js"></script>
</body>
</html>
